name: Build Bookly APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify standalone Bookly files
        run: |
          test -f www/index.html
          test -f www/app.js
          if grep -RInE 'appdeploy|localhost:[0-9]+' www 2>/dev/null; then
            echo 'Standalone APK contains an AppDeploy/localhost runtime dependency.'
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build standalone Bookly APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
