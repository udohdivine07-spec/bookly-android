plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bookly.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bookly.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The Bookly frontend lives in the repository's /www directory.
// Package it into Android assets so the APK is genuinely standalone
// and MainActivity's file:///android_asset/www/index.html exists.
tasks.register('syncBooklyWebAssets', Copy) {
    from(rootProject.file('www'))
    into(file('src/main/assets/www'))
}

preBuild.dependsOn(syncBooklyWebAssets)
